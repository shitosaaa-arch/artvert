name: Prisma Linux verification

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      AUTH_USER_DIRECTORY: prisma
      SPRINT3_VERIFICATION_PASSWORD: sprint3-${{ github.run_id }}-${{ github.run_attempt }}-Aa1!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:status
      - run: npx tsx scripts/prisma-linux-verification.ts prepare
      - run: npm run auth:import-json | tee first-import.log
      - run: "grep -Fx 'Import summary: imported=4, skipped=0, failed=0' first-import.log"
      - run: npm run auth:import-json | tee second-import.log
      - run: "grep -Fx 'Import summary: imported=0, skipped=4, failed=0' second-import.log"
      - run: npx tsx scripts/prisma-linux-verification.ts verify
      - run: npm run test:knowledge
      - run: npm run test:diseases
      - run: npm run build
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: git diff --check
      - if: ${{ always() }}
        run: npx tsx scripts/prisma-linux-verification.ts cleanup
